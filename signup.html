      <!-- Cloudflare Turnstile widget loads here only if TURNSTILE_SITEKEY is configured server-side -->

<script src="js/app.js?v=3"></script>
<script src="js/api.js?v=3"></script>
<script>
  // Cloudflare Turnstile — EXECUTE MODE.
  // The widget renders but does NOT solve until we call turnstile.execute().
  // We trigger that on form submit, then wait for the callback to fire with
  // a brand-new token. This avoids every stale-token / reset-timing pitfall
  // (single-use, 5-min expiry, double-reset, widget-still-verifying, etc).
  let __turnstileWidget = null;
  let __pendingTokenResolve = null;
  let __pendingTokenReject  = null;

  (async () => {
    try {
      await window.eyBackend.ready;
      const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
      const sk = cfg.turnstile_sitekey;
      if (!sk) { console.info('[captcha] disabled server-side (no sitekey)'); return; }
      window.__turnstileSitekey = sk;

      // Render slot for the widget. With appearance:'interaction-only' the
      // widget stays hidden until a human-check is actually needed.
      const slot = document.getElementById('captcha-slot');
      slot.innerHTML = '<div id="turnstile-widget"></div>';

      window.onloadTurnstileCallback = function () {
        if (!window.turnstile) { console.warn('[captcha] turnstile global missing'); return; }
        __turnstileWidget = window.turnstile.render('#turnstile-widget', {
          sitekey: sk,
          theme: 'light',
          execution: 'execute',           // wait for explicit .execute() call
          appearance: 'interaction-only', // hide widget until interaction needed
          callback: function (token) {
            console.info('[captcha] token issued (len ' + (token||'').length + ')');
            if (__pendingTokenResolve) {
              const r = __pendingTokenResolve;
              __pendingTokenResolve = __pendingTokenReject = null;
              r(token);
            }
          },
          'error-callback': function (err) {
            console.warn('[captcha] error-callback:', err);
            if (__pendingTokenReject) {
              const r = __pendingTokenReject;
              __pendingTokenResolve = __pendingTokenReject = null;
              r(new Error('captcha_error:' + (err || 'unknown')));
            }
          },
          'timeout-callback': function () {
            console.warn('[captcha] timeout-callback');
            if (__pendingTokenReject) {
              const r = __pendingTokenReject;
              __pendingTokenResolve = __pendingTokenReject = null;
              r(new Error('captcha_timeout'));
            }
          },
        });
        console.info('[captcha] widget rendered (execute mode)');
      };

      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit';
      s.async = true; s.defer = true;
      s.onerror = () => console.error('[captcha] turnstile script failed to load');
      document.head.appendChild(s);
    } catch (e) {
      console.error('[captcha] init failed:', e);
    }
  })();

  // Trigger a fresh challenge and wait for the callback to give us the token.
  // Always returns a brand-new token (or throws), because we reset() FIRST
  // and Cloudflare regenerates a fresh one in response to execute().
  function requestFreshToken(timeoutMs = 30000) {
    if (!window.__turnstileSitekey) return Promise.resolve('SKIP');
    if (!window.turnstile || __turnstileWidget === null) {
      return Promise.reject(new Error('captcha_not_ready'));
    }
    return new Promise((resolve, reject) => {
      __pendingTokenResolve = resolve;
      __pendingTokenReject  = reject;
      // reset() so we guarantee a fresh token; execute() then triggers it.
      try { window.turnstile.reset(__turnstileWidget); } catch (_) {}
      try { window.turnstile.execute(__turnstileWidget); }
      catch (e) {
        __pendingTokenResolve = __pendingTokenReject = null;
        reject(new Error('captcha_execute_failed'));
        return;
      }
      setTimeout(() => {
        if (__pendingTokenReject) {
          __pendingTokenResolve = __pendingTokenReject = null;
          reject(new Error('captcha_timeout'));
        }
      }, timeoutMs);
    });
  }

  // Plan choice is deferred until after the scan results — show on the
  // dashboard once the user can see the value first. We start everyone on
  // the trial 'family' default; they'll pick a real plan later.
  const plan = 'family';

  async function doSignup(retried) {
    const submitBtn = document.querySelector('#signup-form button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'Verifying…';

    let captcha_token = '';
    if (window.__turnstileSitekey) {
      try {
        const t = await requestFreshToken();
        captcha_token = (t === 'SKIP') ? '' : t;
      } catch (e) {
        console.warn('[captcha] could not get token:', e && e.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Run my free scan →';
        alert('CAPTCHA could not be verified (' + ((e && e.message) || 'unknown') + '). Please try again. If it keeps failing, reload the page.');
        return;
      }
    }

    submitBtn.textContent = 'Running scan…';
    try {
      await window.eyBackend.signup({
        name: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        plan,
        captcha_token,
      });
      window.location.href = 'dashboard.html?welcome=1';
    } catch (err) {
      const code = (err && err.message) || '';
      console.warn('[signup] backend error:', code);
      // On any captcha-side failure, auto-retry ONCE with a fresh token.
      if (code.startsWith('captcha_') && !retried) {
        await new Promise(r => setTimeout(r, 800));
        return doSignup(true);
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Run my free scan →';
      const msg = code === 'email_in_use' ? 'That email is already registered.' :
                  code === 'password_too_short' ? 'Password must be at least 8 characters.' :
                  code === 'invalid_email' ? 'Please enter a valid email.' :
                  code === 'rate_limited' ? 'Too many signup attempts. Please wait 15 minutes and try again.' :
                  code.startsWith('captcha_') ? ('CAPTCHA verification failed (' + code + '). Please reload the page and try again.') :
                  'Signup failed. Please try again.';
      alert(msg);
    }
  }

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await window.eyBackend.ready;
    doSignup(false);
  });
</script>

<script>
  // Register the service worker in production-ish contexts (not file://)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
