    <nav class="nav">

<section style="padding: 16px 0 64px;">
  <div class="form-card" style="max-width:560px">

    <form id="signup-form">
      <div class="form-row">

      <div class="field"><label for="email">Email address</label><input id="email" type="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="8"></div>

      <div class="form-row">
        <div class="field"><label for="city">City</label><input id="city" type="text" placeholder="Optional"></div>
        <div class="field"><label for="state">State</label>
          <select id="state">
            <option value="">Select…</option>
            <option>AL</option><option>AK</option><option>AZ</option><option>AR</option><option>CA</option>
            <option>CO</option><option>CT</option><option>DE</option><option>FL</option><option>GA</option>
            <option>HI</option><option>ID</option><option>IL</option><option>IN</option><option>IA</option>
            <option>KS</option><option>KY</option><option>LA</option><option>ME</option><option>MD</option>
            <option>MA</option><option>MI</option><option>MN</option><option>MS</option><option>MO</option>
            <option>MT</option><option>NE</option><option>NV</option><option>NH</option><option>NJ</option>
            <option>NM</option><option>NY</option><option>NC</option><option>ND</option><option>OH</option>
            <option>OK</option><option>OR</option><option>PA</option><option>RI</option><option>SC</option>
            <option>SD</option><option>TN</option><option>TX</option><option>UT</option><option>VT</option>
            <option>VA</option><option>WA</option><option>WV</option><option>WI</option><option>WY</option>
          </select>
        </div>
      </div>

      <div class="checkbox mb-2">
        <input id="agree" type="checkbox" required>
        <label for="agree" style="font-weight:400">I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>, and I authorize ID Delete to submit removal requests on my behalf.</label>
      </div>

      <!-- Cloudflare Turnstile widget loads here only if TURNSTILE_SITEKEY is configured server-side -->
      <div id="captcha-slot" style="margin:12px 0;"></div>

      <button class="btn btn-primary btn-block btn-lg" type="submit">Run my free scan →</button>

      <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </div>
</section>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
  // Cloudflare Turnstile — visible Managed widget (auto-validates on page load).
  // On each submit we read the current token then reset() so the next attempt
  // gets a fresh one. This avoids the single-use "timeout-or-duplicate" error.
  let __turnstileWidget = null;
  (async () => {
    try {
      await window.eyBackend.ready;
      const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
      const sk = cfg.turnstile_sitekey;
      if (!sk) return;
      window.__turnstileSitekey = sk;
      const slot = document.getElementById('captcha-slot');
      slot.innerHTML = '<div id="turnstile-widget"></div>';
      window.onloadTurnstileCallback = function () {
        if (!window.turnstile) return;
        __turnstileWidget = window.turnstile.render('#turnstile-widget', {
          sitekey: sk,
          theme: 'light',
          'refresh-expired': 'auto',
          'retry': 'auto',
        });
      };
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit';
      s.async = true; s.defer = true;
      document.head.appendChild(s);
    } catch (_) {}
  })();

  // Wait until the Managed widget has a token, then return it AND reset so the
  // next submit gets a brand-new one. Polls every 200ms up to timeoutMs.
  async function freshCaptchaToken(timeoutMs = 15000) {
    if (!window.__turnstileSitekey) return 'SKIP';  // captcha disabled server-side
    return new Promise((resolve) => {
      const start = Date.now();
      const tick = () => {
        let token = '';
        try {
          if (window.turnstile && __turnstileWidget !== null) {
            token = window.turnstile.getResponse(__turnstileWidget) || '';
          }
        } catch (_) {}
        if (token) {
          try { window.turnstile.reset(__turnstileWidget); } catch (_) {}
          resolve(token);
          return;
        }
        if (Date.now() - start > timeoutMs) { resolve(''); return; }
        setTimeout(tick, 200);
      };
      tick();
    });
  }

  // Plan choice is deferred until after the scan results — show on the
  // dashboard once the user can see the value first. We start everyone on
  // the trial 'family' default; they'll pick a real plan later.
  const plan = 'family';

  // Submit. We grab a FRESH captcha token per attempt so we never reuse one,
  // and on captcha errors we auto-retry once before bothering the user.
  async function doSignup(retried) {
    const submitBtn = document.querySelector('#signup-form button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'Verifying…';

    let captcha_token = '';
    if (window.__turnstileSitekey) {
      const t = await freshCaptchaToken();
      if (!t) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Run my free scan →';
        alert('We could not verify the CAPTCHA. Please wait a moment and try again, or reload the page.');
        return;
      }
      captcha_token = (t === 'SKIP') ? '' : t;
    }

    submitBtn.textContent = 'Running scan…';
    try {
      await window.eyBackend.signup({
        name: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        plan,
        captcha_token,
      });
      window.location.href = 'dashboard.html?welcome=1';
    } catch (err) {
      const code = (err && err.message) || '';
      // CAPTCHA failures get one silent retry with a fresh token
      if (code.startsWith('captcha_') && !retried) {
        return doSignup(true);
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Run my free scan →';
      const msg = code === 'email_in_use' ? 'That email is already registered.' :
                  code === 'password_too_short' ? 'Password must be at least 8 characters.' :
                  code === 'invalid_email' ? 'Please enter a valid email.' :
                  code === 'rate_limited' ? 'Too many signup attempts. Please wait 15 minutes and try again.' :
                  code.startsWith('captcha_') ? 'CAPTCHA verification failed. Please reload the page and try again.' :
                  'Signup failed. Please try again.';
      alert(msg);
    }
  }

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await window.eyBackend.ready;
    doSignup(false);
  });
</script>

<script>
  // Register the service worker in production-ish contexts (not file://)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
