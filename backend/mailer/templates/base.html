<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block subject %}ID Delete{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f5f6fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1a1d2e;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f5f6fb;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,0.06);">
          <tr>
            <td style="padding:24px 32px;background:linear-gradient(135deg,#4f46e5 0%,#6366f1 100%);">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background:#ffffff;color:#4f46e5;font-weight:800;font-size:18px;padding:6px 12px;border-radius:8px;letter-spacing:-0.02em;">id</td>
                  <td style="padding-left:12px;color:#ffffff;font-size:18px;font-weight:600;letter-spacing:-0.01em;">ID Delete</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;border-top:1px solid #eef0f7;background:#fafbff;font-size:13px;color:#6b7280;line-height:1.6;">
              <p style="margin:0 0 8px 0;">You're receiving this email because you have an active ID Delete account.</p>
              <p style="margin:0;">ID Delete &middot; <a href="https://iddelete.com" style="color:#4f46e5;text-decoration:none;">iddelete.com</a> &middot; &copy; {{ year }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
