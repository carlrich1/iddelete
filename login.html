<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ID Delete">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Log in — ID Delete</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="container inner">
    <a class="logo" href="index.html"><span class="logo-mark"></span>ID Delete</a>
    <nav class="nav">
      <a href="how-it-works.html">How it works</a><a href="pricing.html">Pricing</a><a href="data-brokers.html">Data brokers</a><a href="faq.html">FAQ</a><a href="about.html">About</a>
    </nav>
    <div class="nav-cta">
      <a class="btn btn-primary" href="signup.html">Start free scan</a>
    </div>
  </div>
</header>

<section style="padding: 20px 0 40px;">
  <div class="form-card">
    <h1>Welcome back.</h1>
    <p class="sub">Log in to see your removal status.</p>

    <form id="login-form">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>

      <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>

      <p class="form-foot"><a href="forgot-password.html">Forgot your password?</a></p>
      <p class="form-foot">No account yet? <a href="signup.html">Start your free scan</a></p>
    </form>
  </div>
</section>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await window.eyBackend.ready;
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'Logging in…';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
      await window.eyBackend.login(email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      submitBtn.disabled = false; submitBtn.textContent = 'Log in';
      const code = (err && err.message) || '';
      if (code === 'rate_limited') {
        alert('Too many login attempts. Please wait 15 minutes and try again.');
      } else {
        alert('Invalid email or password.');
      }
    }
  });
</script>

<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
