<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ID Delete">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Forgot password — ID Delete</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="container inner">
    <a class="logo" href="index.html"><span class="logo-mark"></span>ID Delete</a>
    <nav class="nav">
      <a href="how-it-works.html">How it works</a><a href="pricing.html">Pricing</a><a href="data-brokers.html">Data brokers</a><a href="faq.html">FAQ</a><a href="about.html">About</a>
    </nav>
    <div class="nav-cta">
      <a class="btn btn-primary" href="signup.html">Start free scan</a>
    </div>
  </div>
</header>

<section style="padding: 20px 0 40px;">
  <div class="form-card">
    <h1>Forgot your password?</h1>
    <p class="sub">No problem. Enter your email and we'll send you a reset link.</p>

    <form id="forgot-form">
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link</button>
      <p class="form-foot"><a href="login.html">Back to login</a></p>
    </form>

    <div id="sent-msg" style="display:none;padding:16px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;color:#166534;margin-top:16px;">
      <strong>Check your inbox.</strong> If an account exists for that email, we just sent a reset link. It expires in 1 hour.
    </div>
  </div>
</section>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await window.eyBackend.ready;
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Sending…';
    const email = document.getElementById('email').value.trim();
    try {
      await window.eyBackend.forgotPassword(email);
    } catch (_) { /* always show success to avoid email enumeration */ }
    document.getElementById('forgot-form').style.display = 'none';
    document.getElementById('sent-msg').style.display = 'block';
  });
</script>

<script>
  // Register the service worker in production-ish contexts (not file://)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
