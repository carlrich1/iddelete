<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ID Delete">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Reset password — ID Delete</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="container inner">
    <a class="logo" href="index.html"><span class="logo-mark"></span>ID Delete</a>
    <nav class="nav">
      <a href="how-it-works.html">How it works</a><a href="pricing.html">Pricing</a><a href="data-brokers.html">Data brokers</a><a href="faq.html">FAQ</a><a href="about.html">About</a>
      <a href="dark-web-scan.html">Dark web scan</a>
    </nav>
    <div class="nav-cta">
      <a class="btn btn-primary" href="signup.html">Start free scan</a>
    </div>
  </div>
</header>

<section style="padding: 20px 0 40px;">
  <div class="form-card">
    <h1>Pick a new password</h1>
    <p class="sub">Choose something at least 8 characters long. We'll log you straight in.</p>

    <form id="reset-form">
      <div class="field">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Save new password</button>
      <p id="reset-err" style="display:none;color:#dc2626;margin-top:12px;font-size:14px;"></p>
    </form>

    <div id="no-token" style="display:none;padding:16px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#991b1b;">
      This reset link is missing its token. <a href="forgot-password.html">Request a new one.</a>
    </div>
  </div>
</section>

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('t') || params.get('token') || '';
  if (!token) {
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('no-token').style.display = 'block';
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    await window.eyBackend.ready;
    const err = document.getElementById('reset-err');
    err.style.display = 'none';
    const pw = document.getElementById('password').value;
    const cf = document.getElementById('confirm').value;
    if (pw !== cf) {
      err.textContent = 'Passwords don’t match.';
      err.style.display = 'block';
      return;
    }
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await window.eyBackend.resetPassword(token, pw);
      window.location.href = 'dashboard.html';
    } catch (ex) {
      btn.disabled = false; btn.textContent = 'Save new password';
      const code = (ex && ex.message) || 'unknown';
      const map = {
        token_expired: 'That reset link has expired. Request a new one.',
        token_already_used: 'That reset link has already been used. Request a new one.',
        invalid_token: 'That reset link is no longer valid. Request a new one.',
        password_too_short: 'Password must be at least 8 characters long.',
      };
      err.textContent = map[code] || 'Something went wrong. Please try again.';
      err.style.display = 'block';
    }
  });
</script>

<script>
  // Register the service worker in production-ish contexts (not file://)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
